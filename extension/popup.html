<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --primary: #2d6a4f; --on-primary: #ffffff;
    --surface: #f7f9f7; --surface-variant: #e4eae6;
    --on-surface: #1b1b1f; --on-surface-variant: #5a6b60;
    --outline: #7a8b80; --error: #ba1a1a;
    --shape: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #8fd6b4; --on-primary: #0b3b2e;
      --surface: #1b1b1f; --surface-variant: #2b2f36;
      --on-surface: #e6e1e5; --on-surface-variant: #b7c9bd;
      --outline: #8a9a90;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; padding: 16px;
    font-family: "Google Sans", Roboto, system-ui, sans-serif;
    background: var(--surface); color: var(--on-surface);
  }
  h1 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 12px; color: var(--on-surface-variant); margin-bottom: 12px; }
  .card {
    background: var(--surface-variant); border-radius: var(--shape);
    padding: 14px; margin-bottom: 10px;
  }
  .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .row b { font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: #2e7d4f; } .dot.off { background: #b3541e; } .dot.other { background: #7a8b80; }
  .session { border-top: 1px solid var(--outline); padding-top: 8px; margin-top: 8px; font-size: 12px; }
  .empty { font-size: 13px; color: var(--on-surface-variant); }
  a, button.link {
    display: block; width: 100%; margin-top: 10px; padding: 10px;
    border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary);
    font-size: 13px; font-weight: 500; text-align: center; text-decoration: none; cursor: pointer;
  }
  button.link.secondary { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--outline); }
</style>
</head>
<body>
  <h1>Focus Plan Companion</h1>
  <div class="sub" id="status">Loading…</div>
  <div id="content"></div>
  <a class="link" href="options.html" target="_blank">Open settings</a>
  <script src="popup.js"></script>
</body>
</html>
