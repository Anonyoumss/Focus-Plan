name: Browser extension

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests for extension core
        run: npx vitest run src/lib/extension/core.test.ts
      - name: Package Chrome build
        run: |
          mkdir -p dist-ext/chrome dist-ext/firefox
          cp -r extension/* dist-ext/chrome/
          cp extension/manifest.chrome.json dist-ext/chrome/manifest.json
          cp -r extension/* dist-ext/firefox/
          cp extension/manifest.firefox.json dist-ext/firefox/manifest.json
          rm -f dist-ext/*/manifest.*.json
          cd dist-ext && zip -qr ../focus-plan-companion-chrome.zip chrome && zip -qr ../focus-plan-companion-firefox.zip firefox
      - uses: actions/upload-artifact@v4
        with:
          name: focus-plan-extension-zips
          path: focus-plan-companion-*.zip
          retention-days: 14
      - name: Attach zips to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: focus-plan-companion-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
