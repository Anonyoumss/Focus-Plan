name: Native desktop apps

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['native/**', '.github/workflows/native-desktop.yml']
  workflow_dispatch:

jobs:
  macos-swiftui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, label: aarch64 }
          - { arch: x86_64, runner: macos-15-intel, label: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI app (${{ matrix.arch }})
        env:
          MACOS_GOOGLE_SERVICE_INFO: ${{ secrets.MACOS_GOOGLE_SERVICE_INFO }}
        run: |
          cd native/macos
          swift build -c release --arch ${{ matrix.arch }}
      - name: Bundle .app + DMG (${{ matrix.arch }})
        run: |
          set -e
          ARCH="${{ matrix.arch }}"
          APP="Focus Plan.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "native/macos/.build/apple/Products/Release/FocusPlan" "$APP/Contents/MacOS/FocusPlan" 2>/dev/null \
            || cp "native/macos/.build/release/FocusPlan" "$APP/Contents/MacOS/FocusPlan"
          # Optional Firebase config: set repo secret MACOS_GOOGLE_SERVICE_INFO
          # to the base64 of GoogleService-Info.plist for an iOS/macOS OAuth
          # client in project focus-plan-m3e. Without it the app runs guest.
          if [ -n "$MACOS_GOOGLE_SERVICE_INFO" ]; then
            echo "$MACOS_GOOGLE_SERVICE_INFO" | base64 -d > "$APP/Contents/Resources/GoogleService-Info.plist"
          fi
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Focus Plan</string>
            <key>CFBundleDisplayName</key><string>Focus Plan</string>
            <key>CFBundleIdentifier</key><string>com.focusplan.app</string>
            <key>CFBundleVersion</key><string>0.5.2</string>
            <key>CFBundleShortVersionString</key><string>0.5.2</string>
            <key>CFBundleExecutable</key><string>FocusPlan</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # ad-hoc sign so Gatekeeper lets it run locally
          codesign --force --deep --sign - "$APP"
          tar -czf "focus-plan-macos-${{ matrix.label }}.tar.gz" "$APP"
          # DMG with /Applications symlink (drag-to-install)
          rm -rf dmgroot && mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Focus Plan" -srcfolder dmgroot -ov -format UDZO "Focus.Plan-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: focus-plan-macos-${{ matrix.label }}
          path: |
            focus-plan-macos-${{ matrix.label }}.tar.gz
            Focus.Plan-${{ matrix.label }}.dmg
      - name: Attach to release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "focus-plan-macos-${{ matrix.label }}.tar.gz" --clobber
          gh release upload "${{ github.ref_name }}" "Focus.Plan-${{ matrix.label }}.dmg" --clobber
