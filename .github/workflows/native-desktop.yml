name: Native desktop apps

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['native/**', '.github/workflows/native-desktop.yml']
  workflow_dispatch:

jobs:
  linux-gtk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4/libadwaita toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev
      - name: Build
        run: |
          gcc -O2 -o focus-plan native/linux/main.c $(pkg-config --cflags --libs gtk4 libadwaita-1)
      - name: Package tarball, .deb and AppImage
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "${GITHUB_REF_NAME}" ] && VER="0.0.0-dev"
          PKG="focus-plan_${VER}_amd64"
          rm -rf pkg appdir && mkdir -p pkg/$PKG/DEBIAN pkg/$PKG/usr/bin \
            pkg/$PKG/usr/share/applications pkg/$PKG/usr/share/icons/hicolor/256x256/apps \
            appdir/usr/bin appdir/usr/share/applications appdir/usr/share/icons/hicolor/256x256/apps
          for d in pkg/$PKG appdir; do
            cp focus-plan $d/usr/bin/focus-plan
            cp public/icon-512.png $d/usr/share/icons/hicolor/256x256/apps/focus-plan.png
            printf '[Desktop Entry]\nType=Application\nName=Focus Plan\nComment=Pomodoro focus timer with study goals\nExec=focus-plan\nIcon=focus-plan\nTerminal=false\nCategories=Office;Productivity;\nKeywords=pomodoro;focus;study;\n' > $d/usr/share/applications/focus-plan.desktop
          done
          printf '[Desktop Entry]\nType=Application\nName=Focus Plan\nExec=focus-plan\nIcon=focus-plan\nTerminal=false\nCategories=Office;Productivity;\n' > appdir/focus-plan.desktop
          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/focus-plan" "$@"\n' > appdir/AppRun
          chmod +x appdir/AppRun
          # .deb
          printf 'Package: focus-plan\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: Focus Plan <noreply@focus-plan.app>\nDepends: libgtk-4-1, libadwaita-1-0\nDescription: Pomodoro focus timer with study goals\n Native GTK4/libadwaita app. 100%% offline-first.\n' "$VER" > pkg/$PKG/DEBIAN/control
          dpkg-deb --build pkg/$PKG
          mv pkg/$PKG.deb focus-plan_${VER}_amd64.deb
          # tarball (portable, no package manager needed)
          tar -czf focus-plan-linux-x86_64.tar.gz -C pkg/$PKG usr
          # AppImage
          curl -fSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool appdir focus-plan-${VER}-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: focus-plan-linux-native
          path: |
            focus-plan-linux-x86_64.tar.gz
            focus-plan-*_amd64.deb
            focus-plan-*-x86_64.AppImage
      - name: Attach to release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" focus-plan-linux-x86_64.tar.gz --clobber
          gh release upload "${{ github.ref_name }}" focus-plan-*_amd64.deb --clobber
          gh release upload "${{ github.ref_name }}" focus-plan-*-x86_64.AppImage --clobber

  macos-swiftui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI app
        env:
          MACOS_GOOGLE_SERVICE_INFO: ${{ secrets.MACOS_GOOGLE_SERVICE_INFO }}
        run: |
          cd native/macos
          swift build -c release
      - name: Bundle .app
        run: |
          APP="Focus Plan.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp native/macos/.build/release/FocusPlan "$APP/Contents/MacOS/FocusPlan"
          # Optional Firebase config: set repo secret MACOS_GOOGLE_SERVICE_INFO
          # to the base64 of GoogleService-Info.plist for an iOS/macOS OAuth
          # client in project focus-plan-m3e. Without it the app runs guest.
          if [ -n "$MACOS_GOOGLE_SERVICE_INFO" ]; then
            echo "$MACOS_GOOGLE_SERVICE_INFO" | base64 -d > "$APP/Contents/Resources/GoogleService-Info.plist"
          fi
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Focus Plan</string>
            <key>CFBundleDisplayName</key><string>Focus Plan</string>
            <key>CFBundleIdentifier</key><string>com.focusplan.app</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleExecutable</key><string>FocusPlan</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # ad-hoc sign so Gatekeeper lets it run locally
          codesign --force --deep --sign - "$APP"
          tar -czf focus-plan-macos-arm64.tar.gz "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: focus-plan-macos-native
          path: focus-plan-macos-arm64.tar.gz
      - name: Attach to release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" focus-plan-macos-arm64.tar.gz --clobber
