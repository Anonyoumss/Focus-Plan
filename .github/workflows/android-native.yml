name: Native Android app

# Builds the pure-Kotlin/Compose app in android-native/ (no Capacitor).
# google-services.json is optional: without it the app builds and runs as a
# guest; Firebase config can also come from FP_* gradle properties.

on:
  push:
    branches: [main]
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android-native/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.14.3 (AGP 8.13 is incompatible with Gradle 9.x)
        run: |
          curl -fsSL --retry 5 --retry-delay 15             https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        working-directory: android-native
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            gradle assembleDebug --no-daemon && { ok=1; break; }
            sleep 30
          done
          [ "$ok" = "1" ]
      - uses: actions/upload-artifact@v4
        with:
          name: focus-plan-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
