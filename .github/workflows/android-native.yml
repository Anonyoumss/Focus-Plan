name: Native Android app

# Builds the pure-Kotlin/Compose app in android-native/ (no Capacitor).
# google-services.json is optional: without it the app builds and runs as a
# guest; Firebase config can also come from FP_* gradle properties.

on:
  push:
    branches: [main]
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android-native/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-native
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: focus-plan-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
