name: Native Android app

# Builds the Kotlin Multiplatform app in native-app/ (forked from Tomato,
# GPL-3.0 — see native-app/LICENSE). androidApp + shared Compose UI.
# Flavor: foss (no billing). Package: com.focusplan.app.debug (debug suffix).

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['native-app/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['native-app/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform + build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build foss debug APK
        working-directory: native-app
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            ./gradlew :androidApp:assembleFossDebug --no-daemon --console=plain && { ok=1; break; }
            sleep 30
          done
          [ "$ok" = "1" ]
      - uses: actions/upload-artifact@v4
        with:
          name: focus-plan-native-debug-apk
          path: native-app/androidApp/build/outputs/apk/foss/debug/androidApp-foss-debug.apk
          retention-days: 14
      - name: Attach APK to release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp native-app/androidApp/build/outputs/apk/foss/debug/androidApp-foss-debug.apk "focus-plan-native-${{ github.ref_name }}-debug.apk"
          gh release upload "${{ github.ref_name }}" "focus-plan-native-${{ github.ref_name }}-debug.apk" --clobber
